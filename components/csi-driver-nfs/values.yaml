storageClasses:
- name: nfs-delete
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
  parameters:
    server: 192.168.0.1
    share: /k8sdata
  reclaimPolicy: Delete
  volumeBindingMode: Immediate
  mountOptions:
    - nfsvers=4.1
- name: nfs-retain
  parameters:
    server: 192.168.0.1
    share: /k8sdata
  reclaimPolicy: Retain
  volumeBindingMode: Immediate
  mountOptions:
    - nfsvers=4.1