apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external-gateway
  namespace: istio-system
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      hostname: "*.kambey.org"
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All