apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-lab-internal
  namespace: kube-prometheus-stack
spec:
  parentRefs:
    - name: internal-gateway
      namespace: istio-system
  hostnames:
    - "grafana.lab.internal"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
