apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-automountservice-account-token
spec:
  validationActions:
  - Deny
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ""
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - serviceaccounts
  validations:
  - expression: "!has(object.spec) || !has(object.spec.automountServiceAccountToken) || object.spec.automountServiceAccountToken != true"
    message: "automountServiceAccountToken must be set to false"
    messageExpression: >-
      "automountServiceAccountToken must be set to false(" + (has(object.metadata.name) ? object.metadata.name : "unknown") + ") | KSV-0036 "
