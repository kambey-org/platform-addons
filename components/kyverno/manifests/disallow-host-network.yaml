apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-host-network
  annotations:
    policies.kyverno.io/title: Disallow HostNetwork in ValidatingPolicy
    policies.kyverno.io/category: Pod Security Standards (Restricted) in ValidatingPolicy
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.14.0
    kyverno.io/kyverno-version: 1.14.0
    kyverno.io/kubernetes-version: 1.30+
    policies.kyverno.io/description: HostNetwork for Pods is disallowed on cluster
spec:
  validationActions:
  - Deny
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ""
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - expression: "!has(object.spec.hostNetwork) || object.spec.hostIPC != true"
    message: "Używanie hostNetwork: true is forbidden"
    messageExpression: >-
      "Używanie hostNetwork: true is forbidden (" + object.metadata.name + ") | KSV-0009 "
