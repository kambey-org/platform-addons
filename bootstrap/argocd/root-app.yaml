
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root
  namespace: argo-cd
spec:
  project: default

  source:
    repoURL: https://github.com/kambey-org/platform-addons
    targetRevision: main
    path: apps
    directory:
      recurse: false

  destination:
    server: https://kubernetes.default.svc
    namespace: argo-cd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
