
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubelet-csr-approver
  namespace: argo-cd
spec:
  project: infra

  sources:
    - repoURL: https://postfinance.github.io/kubelet-csr-approver
      chart:  kubelet-csr-approver
      helm:
        releaseName: kubelet-csr-approver
        valueFiles:
          - $values/components/kubelet-csr-approver/values.yaml

    - repoURL: https://github.com/kambey-org/platform-addons
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
