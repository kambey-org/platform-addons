
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio
  namespace: argo-cd
spec:
  project: infra

  sources:
    - repoURL: https://istio-release.storage.googleapis.com/charts
      chart:  istiod
      targetRevision: 1.30.5
      helm:
        releaseName: istio
        valueFiles:
          - $values/components/istio/values.yaml

    - repoURL: https://istio-release.storage.googleapis.com/charts
      chart:  istiod-ingressgateway
      targetRevision: 1.30.5
      helm:
        releaseName: istio
        valueFiles:
          - $values/components/istio/gateway.values.yaml

    - repoURL: https://github.com/kambey-org/platform-addons
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
