
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argo-cd
spec:
  project: infra

  sources:
    - repoURL: https://kyverno.github.io/kyverno/
      chart: kyverno
      targetRevision: 3.9.1
      helm:
        releaseName: kyverno
        valueFiles:
          - $values/components/kyverno/values.yaml

    - repoURL: https://github.com/kambey-org/platform-addons
      targetRevision: main
      ref: values

    - repoURL: https://github.com/kambey-org/platform-addons
      targetRevision: main
      path: components/kyverno/manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
