name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

jobs:
  istio-diff:
    runs-on: self-hosted
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Configure kubeconfig
        env:
          KUBECONF_CONTENT: ${{ secrets.KUBECONF }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONF_CONTENT" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Diff Helm release
        run: |
            helm diff istio/istiod istiod \
              --repo https://istio-release.storage.googleapis.com/charts \
              # --version "1.30.5" \
              --namespace istio \
              --create-namespace \
              # --values istio/values.yaml \
              --wait
      