name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:
env:
  ISTIO_VERSION: 1.30.5
jobs:
  istio-diff:
    runs-on: self-hosted
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubeconfig
        env:
          KUBECONF_CONTENT: ${{ secrets.KUBECONF }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONF_CONTENT" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Diff Helm release
        run: |
            helm diff upgrade istiod istiod \
              --version "$ISTIO_VERSION" \
              --repo https://istio-release.storage.googleapis.com/charts \
              --namespace istio \
              --values charts/istio/values.yaml \
              -- allow-unreleased
  istio-deploy:
    runs-on: self-hosted
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubeconfig
        env:
          KUBECONF_CONTENT: ${{ secrets.KUBECONF }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONF_CONTENT" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Deploy Helm release
        run: |
          helm upgrade --install istiod istiod \
            --repo https://istio-release.storage.googleapis.com/charts  \
            --version "$ISTIO_VERSION" \
            --namespace istio \
            --create-namespace \
            --values charts/istio/values.yaml \
            --wait