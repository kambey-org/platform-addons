name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

jobs:
  istio-diff:
    runs-on: self-hosted
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Configure kubeconfig
        env:
          KUBECONF_CONTENT: ${{ secrets.KUBECONF }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONF_CONTENT" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Diff Helm release
        run: |
          helm upgrade --install my-app ./charts/my-app \
            --namespace dev \
            --create-namespace \
            --wait \
            --timeout 5m
      